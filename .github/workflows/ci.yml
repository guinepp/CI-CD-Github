name: CI/CD - Pratica

on:
  push:
    branches: [feature/esteira]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m flake8 app tests
      - name: Tipagem
        run: python -m mypy app
      - name: Seguranca
        run: python -m bandit -r app
      - name: Testes
        run: python -m pytest -q
      - name: Gerar relatorios
        run: python app/pipeline.py
      - name: Publicar artefato validado
        uses: actions/upload-artifact@v4
        with:
          name: sales-summary
          path: |
            output/summary.csv
            output/annual_summary.csv
          if-no-files-found: error
          retention-days: 30
