name: CI/CD - Pratica

on:
  push:
    branches: [feature/esteira, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m flake8 app tests
      - name: Tipagem
        run: python -m mypy app
      - name: Seguranca
        run: python -m bandit -r app
      - name: Testes
        run: python -m pytest -q
      - name: Gerar relatorios
        run: python app/pipeline.py
      - name: Publicar artefato validado
        uses: actions/upload-artifact@v4
        with:
          name: sales-summary
          path: |
            output/summary.csv
            output/annual_summary.csv
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Baixar artefato aprovado
        uses: actions/download-artifact@v4
        with:
          name: sales-summary
          path: delivery
      - name: Conferir entrega
        run: |
          test -s delivery/summary.csv
          test -s delivery/annual_summary.csv
          sha256sum delivery/*.csv
          echo '## Entrega em production' >> "$GITHUB_STEP_SUMMARY"
          echo 'CSVs aprovados promovidos sem reprocessamento.' >> "$GITHUB_STEP_SUMMARY"
          cat delivery/summary.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Entregar artefato em production
        uses: actions/upload-artifact@v4
        with:
          name: production-summary
          path: delivery/*.csv
          if-no-files-found: error
          retention-days: 30
